<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC1DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FA8FC5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="petalMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA8FC5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0256B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C566;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F2C566;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5E7C2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A9CC7E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="#1A1322" rx="24"/>

  <!-- Stem -->
  <path d="M64 115 C 62 100 60 85 64 70" stroke="url(#stemGreen)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Upper left petal -->
  <ellipse cx="45" cy="45" rx="20" ry="12" fill="url(#petalPink)" transform="rotate(-25 45 45)"/>
  <ellipse cx="46" cy="44" rx="11" ry="7" fill="#FFD9EC" transform="rotate(-25 46 44)"/>

  <!-- Upper right petal -->
  <ellipse cx="83" cy="45" rx="20" ry="12" fill="url(#petalPink)" transform="rotate(25 83 45)"/>
  <ellipse cx="82" cy="44" rx="11" ry="7" fill="#FFD9EC" transform="rotate(25 82 44)"/>

  <!-- Top sepal/petal -->
  <ellipse cx="64" cy="32" rx="14" ry="20" fill="url(#petalMagenta)"/>

  <!-- Lower lateral petals -->
  <ellipse cx="48" cy="70" rx="16" ry="9" fill="url(#petalMagenta)" transform="rotate(20 48 70)"/>
  <ellipse cx="80" cy="70" rx="16" ry="9" fill="url(#petalMagenta)" transform="rotate(-20 80 70)"/>

  <!-- Lip/labellum (center) -->
  <path d="M64 60 C 55 58 48 62 50 70 C 46 72 44 78 48 84 C 44 90 48 96 55 96 C 60 96 62 98 64 98 C 66 98 68 96 73 96 C 80 96 84 90 80 84 C 84 78 82 72 78 70 C 80 62 73 58 64 60 Z"
        fill="url(#petalMagenta)"/>

  <!-- Golden center of lip -->
  <ellipse cx="64" cy="76" rx="8" ry="5" fill="url(#lipGold)"/>

  <!-- Small dots on the lip -->
  <circle cx="61" cy="76" r="1.5" fill="#8E1F55"/>
  <circle cx="67" cy="76" r="1.5" fill="#8E1F55"/>

  <!-- Decorative lines on lip -->
  <path d="M58 84 C 54 88 50 88 46 86" fill="none" stroke="#8E1F55" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 84 C 74 88 78 88 82 86" fill="none" stroke="#8E1F55" stroke-width="1.5" stroke-linecap="round"/>
</svg>
